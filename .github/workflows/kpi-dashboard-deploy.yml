name: KPI Dashboard CI/CD

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      IMAGE_REPO: thienhaisoft/kpi-performance

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set short commit tag
        run: echo "GIT_TAG=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push backend image
        run: |
          docker build \
            -t "${IMAGE_REPO}:backend-${GIT_TAG}" \
            -f kpi-dashboard/dashboard/backend-go/Dockerfile \
            kpi-dashboard/dashboard/backend-go
          docker push "${IMAGE_REPO}:backend-${GIT_TAG}"

      - name: Build & push frontend image
        run: |
          docker build \
            --build-arg VITE_API_URL="${{ secrets.VITE_API_URL }}" \
            -t "${IMAGE_REPO}:frontend-${GIT_TAG}" \
            -f kpi-dashboard/dashboard/frontend/Dockerfile \
            kpi-dashboard/dashboard/frontend
          docker push "${IMAGE_REPO}:frontend-${GIT_TAG}"

      - name: Deploy on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT }}
          script: |
            set -e
            cd "${{ secrets.VPS_PROJECT_DIR }}"
            git pull
            export GIT_TAG="${GIT_TAG}"
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
            docker compose -f docker-compose.prod.yml up -d

